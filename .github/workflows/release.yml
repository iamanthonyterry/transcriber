name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon, needed for MLX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The tag is the version: v1.2.3 -> 1.2.3 (shown in the app and compared by the updater).
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > version.py
      - run: ./build_app.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.0.0 apps look for the old update name, so keep a copy under it. Drop once everyone is past 1.0.0.
          cp dist/Transcriber-update.zip dist/Lifepoint-Transcriber-update.zip
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/Transcriber.zip dist/Transcriber-update.zip dist/Lifepoint-Transcriber-update.zip
      - name: Keep the update zip as an artifact on manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: update-zip
          path: dist/Transcriber-update.zip
